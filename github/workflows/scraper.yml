  name: Scraper diario
  
  on:
    schedule:
      - cron: '0 12 * * *'   # 12:00 UTC = 08:00 en Chile
    workflow_dispatch:        # botón para correrlo manualmente

  jobs:
    scrape:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: '3.12'

        - name: Instalar Chrome y pantalla virtual (xvfb)
          run: sudo apt-get update && sudo apt-get install -y xvfb
  google-chrome-stable

        - name: Instalar dependencias
          run: pip install -r requirements.txt

        - name: Correr scraper
          run: xvfb-run -a python searchdatahouse.py

        - name: Guardar el Excel
          uses: actions/upload-artifact@v4
          with:
            name: resultado-excel
            path: '*.xlsx'

