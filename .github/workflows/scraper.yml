  name: Scraper diario

  on:
    schedule:
      - cron: '0 12 * * *'
    workflow_dispatch:

  jobs:
    scrape:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: '3.12'

        - name: Instalar Google Chrome
          run: |
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable

        - name: Instalar dependencias
          run: pip install -r requirements.txt

        - name: Correr scraper
          env:
            HEADLESS: "true"
          run: python searchdatahouse.py

        - name: Guardar resultados (Excel + diagnóstico)
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: resultado
            path: |
              *.xlsx
              *.html
              *.json
              *.png
